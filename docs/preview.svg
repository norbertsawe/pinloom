<svg xmlns="http://www.w3.org/2000/svg" width="728" height="976" viewBox="0 0 728 976" role="img" aria-labelledby="title desc">
<title id="title">Pinloom terminal component view</title>
<desc id="desc">NE555 with a package silhouette, pinout grid, supply, power and ground connections, and electrical notes.</desc>
<rect width="728" height="976" rx="12" fill="#0d1117"/>
<path d="M12 0H716Q728 0 728 12V40H0V12Q0 0 12 0" fill="#161b22"/>
<circle cx="20" cy="20" r="5" fill="#ff7b72"/><circle cx="38" cy="20" r="5" fill="#e3b341"/><circle cx="56" cy="20" r="5" fill="#7ee787"/>
<g font-family="DejaVu Sans Mono,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="80" y="25" fill="#e6edf3">Pinloom / offline hardware reference</text>
<text x="24" y="68">
<tspan fill="#e6edf3" font-weight="400">$ pinloom ne555</tspan>
</text>
<text x="24" y="88">
<tspan fill="#79c0ff" font-weight="700">NE555 (PDIP-8) [ne555]</tspan>
</text>
<text x="24" y="108">
<tspan fill="#e6edf3" font-weight="400">Single bipolar timer for oscillators and pulse generation.</tspan>
</text>
<text x="24" y="128">
</text>
<text x="24" y="148">
<tspan fill="#e6edf3" font-weight="400">Package: PDIP-8</tspan>
</text>
<text x="24" y="168">
<tspan fill="#e6edf3" font-weight="400">Category: analog | Pins: 8</tspan>
</text>
<text x="24" y="188">
<tspan fill="#e3b341" font-weight="700">Supply: 4.5-16 V</tspan>
</text>
<text x="24" y="208">
</text>
<text x="24" y="228">
<tspan fill="#79c0ff" font-weight="700">PACKAGE APPEARANCE</tspan>
</text>
<text x="24" y="248">
<tspan fill="#79c0ff" font-weight="400">------------------------------------------------</tspan>
</text>
<text x="24" y="268">
<tspan fill="#e6edf3" font-weight="400">       .----------------.</tspan>
</text>
<text x="24" y="288">
<tspan fill="#e6edf3" font-weight="400">      /                /|</tspan>
</text>
<text x="24" y="308">
<tspan fill="#e6edf3" font-weight="400">     +----------------+ |</tspan>
</text>
<text x="24" y="328">
<tspan fill="#e6edf3" font-weight="400">  ===|                | |===</tspan>
</text>
<text x="24" y="348">
<tspan fill="#e6edf3" font-weight="400">  ===|       IC       | |===</tspan>
</text>
<text x="24" y="368">
<tspan fill="#e6edf3" font-weight="400">  ===|                | /===</tspan>
</text>
<text x="24" y="388">
<tspan fill="#e6edf3" font-weight="400">     +----------------+/</tspan>
</text>
<text x="24" y="408">
<tspan fill="#e6edf3" font-weight="400">Illustrative silhouette; lead positions/count are simplified. Not to scale or a</tspan>
</text>
<text x="24" y="428">
<tspan fill="#e6edf3" font-weight="400">wiring reference.</tspan>
</text>
<text x="24" y="448">
</text>
<text x="24" y="468">
<tspan fill="#79c0ff" font-weight="700">PINOUT</tspan>
</text>
<text x="24" y="488">
<tspan fill="#79c0ff" font-weight="400">------------------------------------------------</tspan>
</text>
<text x="24" y="508">
<tspan fill="#e6edf3" font-weight="400">Top view; notch up. Pin 1 at upper left; numbers run counterclockwise.</tspan>
</text>
<text x="24" y="528">
</text>
<text x="24" y="548">
<tspan fill="#e6edf3" font-weight="400">            +-------+</tspan>
</text>
<text x="24" y="568">
<tspan fill="#e6edf3" font-weight="700">  [GND] GND</tspan>
<tspan fill="#e6edf3" font-weight="400"> | 1   8 | </tspan>
<tspan fill="#ff7b72" font-weight="700">[PWR] VCC  </tspan>
</text>
<text x="24" y="588">
<tspan fill="#e3b341" font-weight="700"> [ANA] TRIG</tspan>
<tspan fill="#e6edf3" font-weight="400"> | 2   7 | </tspan>
<tspan fill="#d2a8ff" font-weight="700">[CTL] DISCH</tspan>
</text>
<text x="24" y="608">
<tspan fill="#7ee787" font-weight="700">   [IO] OUT</tspan>
<tspan fill="#e6edf3" font-weight="400"> | 3   6 | </tspan>
<tspan fill="#e3b341" font-weight="700">[ANA] THRES</tspan>
</text>
<text x="24" y="628">
<tspan fill="#d2a8ff" font-weight="700"> [CTL] /RST</tspan>
<tspan fill="#e6edf3" font-weight="400"> | 4   5 | </tspan>
<tspan fill="#e3b341" font-weight="700">[ANA] CONT </tspan>
</text>
<text x="24" y="648">
<tspan fill="#e6edf3" font-weight="400">            +-------+</tspan>
</text>
<text x="24" y="668">
</text>
<text x="24" y="688">
<tspan fill="#e6edf3" font-weight="400">PWR power | GND ground | IO digital | ANA analog | BUS interface | CTL control |</tspan>
</text>
<text x="24" y="708">
<tspan fill="#e6edf3" font-weight="400">NC unused</tspan>
</text>
<text x="24" y="728">
</text>
<text x="24" y="748">
<tspan fill="#79c0ff" font-weight="700">KEY DETAILS</tspan>
</text>
<text x="24" y="768">
<tspan fill="#79c0ff" font-weight="400">------------------------------------------------</tspan>
</text>
<text x="24" y="788">
<tspan fill="#ff7b72" font-weight="700">Power pins: VCC (8)</tspan>
</text>
<text x="24" y="808">
<tspan fill="#e6edf3" font-weight="700">Ground pins: GND (1)</tspan>
</text>
<text x="24" y="828">
<tspan fill="#e3b341" font-weight="700">Note: Decouple the supply close to the IC. RESET is active low.</tspan>
</text>
<text x="24" y="848">
</text>
<text x="24" y="868">
<tspan fill="#79c0ff" font-weight="700">REFERENCES</tspan>
</text>
<text x="24" y="888">
<tspan fill="#79c0ff" font-weight="400">------------------------------------------------</tspan>
</text>
<text x="24" y="908">
<tspan fill="#e6edf3" font-weight="400">Source: http://www.ti.com/lit/ds/symlink/ne555.pdf</tspan>
</text>
<text x="24" y="928">
</text>
<text x="24" y="948">
<tspan fill="#e6edf3" font-weight="400">Use -d for all pin functions, electrical notes and source links.</tspan>
</text>
</g>
</svg>
