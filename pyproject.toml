[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinloom"
version = "3.0.1"
description = "Offline, cross-platform electronic component pinouts with fuzzy search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["docs/licenses/*"]
dependencies = ["colorama>=0.4.6; sys_platform == 'win32'"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.2"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "jsonschema>=4.23", "PyYAML>=6.0.2"]

[project.urls]
Repository = "https://github.com/norbertsawe/pinloom"
Database = "https://github.com/norbertsawe/pinout-pages"

[project.scripts]
pinloom = "pinloom.cli:main"

[tool.setuptools.packages.find]
include = ["pinloom*"]

[tool.setuptools.package-data]
"pinloom.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
